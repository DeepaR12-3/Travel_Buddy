<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Buddy - Discover Incredible India</title>

    <!-- Leaflet Map CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <div class="nav-container">
          <div class="logo"><i class="fas fa-plane"></i> Travel Buddy</div>
          <ul>
            <li>
              <a href="#home"><i class="fas fa-home"></i> Home</a>
            </li>
            <li>
              <a href="#explore"><i class="fas fa-map"></i> Explore</a>
            </li>
            <li>
              <a href="#mytrip"
                ><i class="fas fa-map-marked-alt"></i> My Trip</a
              >
            </li>
            <li>
              <a href="#emergency"
                ><i class="fas fa-exclamation-triangle"></i> SOS</a
              >
            </li>
            <li>
              <a href="#settings"><i class="fas fa-cog"></i> Settings</a>
            </li>
            <li>
              <a href="#memories"><i class="fas fa-camera"></i> Memories</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main id="content">
      <!-- Content will be loaded here -->
    </main>

    <!-- Map Container for popups -->
    <div id="mapPopup" class="map-popup hidden"></div>

    <!-- Leaflet Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/map-utils.js"></script>
    <script src="js/map-functions.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
